[project]
name = "dspark-harness"
version = "0.1.0"
description = "Standalone validation harness for DSpark speculative decoding semantics."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
dspark-harness = "dspark_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dspark_harness"]

[dependency-groups]
dev = [
    "hypothesis>=6.144.0",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
